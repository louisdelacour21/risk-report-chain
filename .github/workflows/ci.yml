name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests synth
      - run: pytest -q --cov=riskreport --cov-fail-under=80
      - run: python -m riskreport.cli showcase --out showcase
