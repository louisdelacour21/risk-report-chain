# Everything that changes a number lives here and is hashed into the run journal.
[run]
n_scenarios = 500
var_conf = 0.99
es_conf = 0.975
horizon_days = 1

[limits_status]
warn_at = 0.85

[controls]
stale_days = 3          # C06
jump_sigmas = 6.0       # C07, EWMA vol
ewma_lambda = 0.94
nominal_tol_eur = 1000  # C08
vol_min = 0.01          # C11
vol_max = 3.0
explain_rel = 0.05      # C12
explain_abs_eur = 10000

[synth]
seed = 42
n_days = 750

# CSV dialect per source (what the extractions really look like: back office exports with ';' and decimal comma)
[sources.positions_fo]
sep = ","
decimal = "."
[sources.positions_bo]
sep = ";"
decimal = ","
[sources.statics]
sep = ","
decimal = "."
[sources.prices]
sep = ","
decimal = "."
[sources.fx]
sep = ","
decimal = "."
[sources.limits]
sep = ";"
decimal = ","
[sources.factor_history]
sep = ","
decimal = "."

[valuation]
r = 0.025   # flat risk-free for Black-Scholes
q = 0.015   # flat dividend yield
